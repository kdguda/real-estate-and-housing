<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - BatFind</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>BatFind</h1>
        <nav>
            <span id="nav-user-greeting" class="user-greeting" style="display: none;"></span>
            <a href="index.html">Browse</a>
            <a href="favorites.html">Favorites <span id="fav-count">(0)</span></a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html" id="nav-auth-link">Login</a>
        </nav>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" data-tab="login">Login</button>
                <button type="button" class="auth-tab" data-tab="register">Sign Up</button>
            </div>

            <form id="login-form" class="auth-form">
                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Sign in to sync your saved dorms and contact landlords.</p>

                <label for="login-email">Email or Student ID</label>
                <input type="text" id="login-email" placeholder="e.g. juandelacruz@gmail.com" required>

                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter your password" required>

                <button type="submit" class="btn auth-submit">Sign In</button>
            </form>

            <form id="register-form" class="auth-form" style="display: none;">
                <h2>Create Student Account</h2>
                <p class="auth-subtitle">Save favorite listings and message dorm owners.</p>

                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" placeholder="Juan Dela Cruz" required>

                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" placeholder="juandelacruz@gmail.com" required>

                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" placeholder="Create a password" required>

                <button type="submit" class="btn auth-submit">Create Account</button>
            </form>

            <p id="auth-message" class="auth-message"></p>
            <button type="button" id="reset-storage-btn" style="background: none; border: none; color: #999; font-size: 12px; cursor: pointer; display: block; margin: 0 auto 20px; text-decoration: underline;">
                Reset All Saved Local Data
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
